<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Tecnico Sistema Moda — IIS Caterina da Siena, Milano">
  <rect width="1200" height="630" fill="#f5efe6"/>

  <!-- griglia di riferimento: il passo base del sito, dichiarato e non decorato -->
  <g stroke="#e2d6c4" stroke-width="1">
    <path d="M0 150h1200M0 300h1200M0 450h1200"/>
    <path d="M300 0v630M600 0v630M900 0v630"/>
  </g>

  <!-- misura: filo di taglio e spessore di tessuto -->
  <path d="M80 560h1040" stroke="#c9a97f" stroke-width="4"/>
  <g stroke="#2b2019" stroke-width="2">
    <path d="M80 60v500M1120 60v500"/>
    <path d="M80 60h40M80 560h40M1120 60h-40M1120 560h-40"/>
  </g>

  <!-- testo -->
  <text x="80" y="270" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#2b2019">Tecnico Sistema Moda</text>
  <text x="80" y="330" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="3" fill="#6d5c4e">IIS CATERINA DA SIENA — MILANO</text>

  <!-- una riga di colore d'azione: una sola, come nel sito -->
  <rect x="80" y="370" width="240" height="8" fill="#a4553a"/>
</svg>
