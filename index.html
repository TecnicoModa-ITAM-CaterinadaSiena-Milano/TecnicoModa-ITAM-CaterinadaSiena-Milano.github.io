<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accesso riservato | Tecnico Sistema Moda (ITAM)</title>
  <meta name="description" content="Pagina di accesso riservato del Tecnico Sistema Moda (ITAM), IIS Caterina da Siena, Milano.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#500019">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Syne:wght@600;700;800&display=swap">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=1791590273686">
</head>
<body class="accesso">
  <main class="accesso__box" id="contenuto">
    <img class="accesso__logo" src="identita/logo-caterina-bianco.png" alt="" width="544" height="260">
    <h1 class="accesso__titolo">Accesso riservato</h1>
    <p class="accesso__testo">Questo sito è ancora in preparazione. Inserisci la password per vederlo.</p>
    <form class="accesso__modulo" id="modulo" novalidate>
      <label class="accesso__etichetta" for="password">Password</label>
      <input class="accesso__campo" type="password" id="password" name="password"
             autocomplete="current-password" required aria-describedby="accesso-errore">
      <button class="btn accesso__pulsante" type="submit">Entra</button>
    </form>
    <p class="accesso__errore" id="accesso-errore" role="alert" hidden>Password non corretta. Riprova.</p>
    <noscript>
      <p class="accesso__errore">Per entrare serve attivare JavaScript su questa pagina.</p>
    </noscript>
  </main>

  <script>
    /* L'impronta della password, non la password: nel codice non c'e' scritta.
       Serve a non lasciarla in chiaro, non e' un segreto: chi sa leggere
       il codice del sito puo' aggirare la pagina. */
    (function () {
      var IMPRONTA = 'e8336e79a9dd67f9deb95e313378d1fd254a065622729dcc2c75aeb5a409a056';
      var CHIAVE = 'tsm-accesso-approvato';
      var DESTINAZIONE = 'home.html';
      var modulo = document.getElementById('modulo');
      var campo = document.getElementById('password');
      var errore = document.getElementById('accesso-errore');

      function entrare() { location.replace(DESTINAZIONE); }

      if (sessionStorage.getItem(CHIAVE)) entrare();

      function improntaDi(testo) {
        return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(testo))
          .then(function (buffer) {
            return Array.prototype.map.call(new Uint8Array(buffer), function (b) {
              return b.toString(16).padStart(2, '0');
            }).join('');
          });
      }

      modulo.addEventListener('submit', function (evento) {
        evento.preventDefault();
        if (!campo.value) { campo.focus(); return; }
        improntaDi(campo.value).then(function (trovata) {
          if (trovata === IMPRONTA) {
            sessionStorage.setItem(CHIAVE, '1');
            entrare();
          } else {
            errore.hidden = false;
            campo.value = '';
            campo.focus();
          }
        });
      });
    })();
  </script>
</body>
</html>
